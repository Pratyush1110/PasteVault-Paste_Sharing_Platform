<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasteVault - Fast C++ Pastebin</title>

    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="stylesheet" href="/style.css">

    <!-- Prism.js Dark Theme (Okaidia) CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 onclick="window.location.href='/'" style="cursor: pointer;">🔐 PasteVault</h1>
            <p>Powered by C++, Crow & SQLite</p>
        </header>

        <!-- CREATE PASTE VIEW -->
        <section id="create-view" class="card">
            <h2>New Paste</h2>
            <textarea id="paste-content" placeholder="Paste your text or code here..." rows="8"></textarea>
            
            <div class="controls">
                <label for="ttl-select">Expiration:</label>
                <select id="ttl-select">
                    <option value="-1">Never</option>
                    <option value="5">5 Minutes</option>
                    <option value="60" selected>1 Hour</option>
                    <option value="1440">1 Day</option>
                </select>
                <button id="create-btn" onclick="createPaste()">Create Paste</button>
            </div>

            <div id="create-result" class="result-box hidden">
                <p>Paste created! Shareable Link:</p>
                <div class="share-url">
                    <input type="text" id="share-link" readonly>
                    <button onclick="copyLink()">Copy</button>
                </div>
            </div>
        </section>

        <!-- VIEW PASTE VIEW -->
        <section id="read-view" class="card hidden">
            <div class="paste-header">
                <h2>Paste View</h2>
                <button class="secondary-btn" onclick="window.location.href='/'">+ New Paste</button>
            </div>
            <div id="view-result" class="result-box">
                <div class="paste-meta">
                    <span id="meta-created"></span>
                    <span id="meta-expires"></span>
                </div>
                <!-- Pre & Code block formatted for Prism.js -->
                <pre><code id="paste-display" class="language-clike"></code></pre>
                <button class="danger-btn" onclick="deletePaste()">Delete Paste</button>
            </div>
        </section>
    </div>

    <!-- Prism.js Core + Autoloader Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <script src="/app.js"></script>
</body>
</html>
